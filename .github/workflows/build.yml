name: Build RANK1
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      
      - name: Compile
        run: cl /nologo /EHsc /W1 /O2 /MT /utf-8 /D_CRT_SECURE_NO_WARNINGS main.cpp /Fe:BYrank1shop.exe /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib kernel32.lib dwmapi.lib
      
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: BYrank1shop
          path: BYrank1shop.exe
